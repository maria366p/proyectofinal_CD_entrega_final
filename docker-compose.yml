services:
  api:
    build: ./api
    image: duplicados-api:0.1.0
    environment:
      ENV: prod
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
  dashboard:
    build: ./dashboard
    image: duplicados-dashboard:0.1.0
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
